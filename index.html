<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Medicina</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f7fb;
}

/* HEADER */
header{
    text-align:center;
    padding:30px 15px;
    background:#0f2d3f;
    color:white;
}

header h1{
    margin:0;
    font-size:32px;
}

header h2{
    margin-top:10px;
    font-size:22px;
    font-weight:normal;
    opacity:0.9;
}

/* CONTENEDOR EN GRID 3 COLUMNAS */
.container{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:40px;
    padding:50px;
    justify-items:center;
}

/* LINK SIN ESTILO */
a{
    text-decoration:none;
}

/* ICONO CIRCULAR DORADO */
.icon-box{
    text-align:center;
}

/* IMAGEN GRANDE CIRCULAR */
.icon-box img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:6px solid #d4af37;
    object-fit:cover;
    transition:0.3s;
}

/* EFECTO */
.icon-box img:hover{
    transform:scale(1.08);
}

/* TEXTO */
.icon-box span{
    display:block;
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
    color:#0f2d3f;
}

/* RESPONSIVE (CELULAR) */
@media(max-width:768px){
    .container{
        grid-template-columns:repeat(2, 1fr);
        gap:25px;
    }
}

@media(max-width:500px){
    .container{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:24px;
    }
}
</style>

</head>

<body>

<header>
    <h1>LICENCIATURA DE MÉDICO GENERAL</h1>
    <h2>5° "J"</h2>
</header>

<div class="container">

    <a href="horario.html">
        <div class="icon-box">
            <img src="img/horario.png" alt="Horario">
            <span>Horario de Clases</span>
        </div>
    </a>

    <a href="examenes.html">
        <div class="icon-box">
            <img src="img/examenes.png" alt="Exámenes">
            <span>Calendario de Exámenes</span>
        </div>
    </a>

    <a href="malla.html">
        <div class="icon-box">
            <img src="img/malla.jpeg">
            <span>Malla Curricular</span>
        </div>
    </a>

    <a href="rotaciones.html">
        <div class="icon-box">
            <img src="img/rotaciones.png" alt="Rotaciones">
            <span>Rotaciones</span>
        </div>
    </a>

    <a href="docentes.html">
        <div class="icon-box">
            <img src="img/docentes.png" alt="Docentes">
            <span>Docentes</span>
        </div>
    </a>

</div>

</body>
</html>
